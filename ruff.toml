target-version = "py310"
line-length = 120
# The audit report scripts in tools/ are one-off generators written densely (several statements a line); they are
# not part of the app.
extend-exclude = ["backend/*/migrations", "tools/audit-*.py", "tools/summarize-*.py", "tools/pptx-audit-server.py"]

[lint]
# pyflakes, core pycodestyle errors, bugbear.
select = ["E4", "E7", "E9", "F", "B"]
# One-line `if x: y` / `try: ... except: ...` is used deliberately in the bridge code.
ignore = ["E701"]
