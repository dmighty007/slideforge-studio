site_name: SlideForge
site_description: Scientific figures. Presentation ready. A free desktop presentation app for researchers, teachers and students.
site_url: https://dmighty007.github.io/slideforge-studio/
repo_url: https://github.com/dmighty007/slideforge-studio
repo_name: dmighty007/slideforge-studio
edit_uri: edit/main/docs/
copyright: SlideForge is free and open source.

docs_dir: docs
# Internal notes and audit evidence stay in the repository, not on the site. The showcase decks under
# showcase/decks/ are generated by tools/build-showcase.cjs before the site is built.
exclude_docs: |
  audits/
  plans/
  examples/
  APP_DESCRIPTION.md
  PRODUCT_PRESENTATION.md

theme:
  name: material
  logo: images/logo.svg
  favicon: images/logo.svg
  # Fonts are served locally through stylesheets/extra.css.
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.tracking
    - toc.follow
    - content.tabs.link
    - navigation.top
    - navigation.footer
    - navigation.instant
    - content.code.copy
    - search.suggest
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Get started:
      - Install: install.md
      - Your first presentation: getting-started.md
  - Capabilities: features.md
  - Showcase:
      - showcase/index.md
      - Capabilities deck: showcase/capabilities.md
      - Animation deck: showcase/animations.md
  - Guides:
      - Scientific objects: guides/scientific-objects.md
      - Presenting and recording: guides/presenting.md
      - Imports and exports: guides/import-export.md
  - Reference:
      - Desktop app: DESKTOP.md
      - Plugin reference: PLUGINS.md
      - Development: DEVELOPMENT.md
